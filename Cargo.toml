[package]
name = "zed-void"
version = "0.1.0"
edition = "2024"

[dependencies]
# Bevy - игровой движок
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
bevy = { version = "0.15", features = [
    "dynamic_linking", # Быстрая компиляция (только для разработки)
] }

# Будем добавлять по мере необходимости:
# bevy_renet = "0.0.15"  # Для мультиплеера (неделя 4)
# serde = { version = "1.0", features = ["derive"] }  # Для сохранений (неделя 3)
# rand = "0.8"  # Для генерации зомби (неделя 2)

# Оптимизация для dev режима (быстрая компиляция)
[profile.dev]
opt-level = 1

# Оптимизация для релиза (максимальная производительность)
[profile.release]
opt-level = 3
lto = true
codegen-units = 1